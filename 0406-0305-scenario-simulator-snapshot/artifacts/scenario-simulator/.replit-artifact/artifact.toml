kind = "web"
previewPath = "/"
title = "Scenario Simulator"
version = "1.0.0"
id = "artifacts/scenario-simulator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20463

[services.development]
run = "pnpm --filter @workspace/scenario-simulator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scenario-simulator", "run", "build" ]
publicDir = "artifacts/scenario-simulator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20463"
BASE_PATH = "/"
